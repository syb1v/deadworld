name: CI and prerelease

on:
  push:
    branches: [main]
    tags: ["v*-prealpha.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix server run check
      - run: npm --prefix server test
      - run: npm --prefix server run build
      - run: node --test admin/server.test.mjs
      - run: docker compose --env-file .env.example -f infra/docker-compose.prod.yml config --quiet

  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"
      - name: Export clients
        run: make export-all
      - name: Package desktop clients
        run: python3 scripts/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          name: Project Deadworld ${{ github.ref_name }}
          body: |
            Pre-alpha multiplayer survival tech test.
            Physical PC ↔ Android acceptance is not yet complete; this is not the final MVP release.
          files: |
            release/deadworld-linux-x86_64.zip
            release/deadworld-windows-x86_64.zip
            release/deadworld-android-arm64.apk
            release/SHA256SUMS.txt
